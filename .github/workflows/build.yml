name: Mac and iPhone app

on:
  push:
    paths: ["apple/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["apple/**", ".github/workflows/build.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            destination: "generic/platform=macOS"
          - name: iOS
            destination: "generic/platform=iOS Simulator"
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Xcode version
        run: xcodebuild -version
      - name: Compile (no signing)
        run: |
          set -o pipefail
          xcodebuild build \
            -project apple/Kay2Do.xcodeproj \
            -scheme Kay2Do \
            -configuration Debug \
            -destination "${{ matrix.destination }}" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build.log | grep -E "error|warning: unre|BUILD|\*\*" || true
          grep -q "BUILD SUCCEEDED" build.log
      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ matrix.name }}
          path: build.log
